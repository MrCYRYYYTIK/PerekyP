<script>
var user = null;
var dengi = 1000;
var lvl = 1;
var opyt = 0;
var energ = 20;
var maxEnerg = 20;
var inv = [];
var loty = [];
var dolg = 0;
var activeSkin = '👤';
var tab = 'market';
var tema = 'dark';

var poslBonus = 0;
var seriyaDney = 0;
var poslRul = 0;

var dostizheniya = [
  { id: 'first_buy', name: 'Первая покупка', desc: 'Купи первый товар', icon: '🛒', reward: 100, done: false },
  { id: 'first_sell', name: 'Первая продажа', desc: 'Продай первый товар', icon: '💰', reward: 200, done: false },
  { id: 'sell_10', name: 'Десять сделок', desc: 'Продай 10 товаров', icon: '📈', reward: 1000, done: false },

  { id: 'sell_200', name: 'Магнат', desc: 'Продай 200 товаров', icon: '💎', reward: 50000, done: false },
  { id: 'lvl_5', name: 'Пятый уровень', desc: 'Достигни 5 уровня', icon: '⭐', reward: 2000, done: false },
  { id: 'lvl_10', name: 'Десятый уровень', desc: 'Достигни 10 уровня', icon: '🌟', reward: 10000, done: false },
  { id: 'lvl_20', name: 'Двадцатый уровень', desc: 'Достигни 20 уровня', icon: '🏆', reward: 100000, done: false },
  { id: 'money_10k', name: 'Первые 10000', desc: 'Накопи 10000₽', icon: '💵', reward: 3000, done: false },
  { id: 'money_100k', name: 'Сто тысяч', desc: 'Накопи 100000₽', icon: '🏆', reward: 20000, done: false },
  { id: 'money_1m', name: 'Миллионер', desc: 'Накопи 1 000 000₽', icon: '👑', reward: 200000, done: false },
  { id: 'roulette_win', name: 'Джекпот', desc: 'Выиграй в рулетке 10000₽', icon: '🎰', reward: 5000, done: false }
];

var skiny = [
  { id: '👤', name: 'Обычный', price: 0 },
  { id: '💼', name: 'Бизнесмен', price: 1000 },
  { id: '🕶️', name: 'Крутой', price: 3000 },
  { id: '🎩', name: 'Магнат', price: 10000 },
  { id: '👑', name: 'Король рынка', price: 50000 },
  { id: '🤴', name: 'Император', price: 200000 },
  { id: '🐲', name: 'Дракон', price: 1000000 }
];

var kupilVsego = 0;
var prodalVsego = 0;
var jackpotVyl = false;

var tovari = [
  { id: 'phone', name: '📱 Старый телефон', cena: 300, lvl: 1, ap: 150, category: 'tech' },
  { id: 'sneak', name: '👟 Кроссовки', cena: 500, lvl: 1, ap: 200, category: 'clothes' },
  { id: 'bike', name: '🚲 Велосипед', cena: 1000, lvl: 2, ap: 400, category: 'tech' },
  { id: 'laptop', name: '💻 Ноутбук', cena: 2500, lvl: 3, ap: 900, category: 'tech' },
  { id: 'guitar', name: '🎸 Гитара', cena: 4000, lvl: 4, ap: 1200, category: 'music' },
  { id: 'tv', name: '📺 Телевизор', cena: 6000, lvl: 5, ap: 1800, category: 'tech' },
  { id: 'moto', name: '🏍️ Мотоцикл', cena: 15000, lvl: 7, ap: 4000, category: 'auto' },
  { id: 'garage', name: '🏚️ Гараж', cena: 30000, lvl: 9, ap: 8000, category: 'realty' },
  { id: 'car_old', name: '🚗 Старая машина', cena: 60000, lvl: 11, ap: 15000, category: 'auto' },
  { id: 'car_new', name: '🚙 Хорошая машина', cena: 150000, lvl: 13, ap: 35000, category: 'auto' },
  { id: 'flat_1', name: '🏠 Однушка', cena: 300000, lvl: 15, ap: 70000, category: 'realty' },
  { id: 'flat_2', name: '🏢 Двушка', cena: 600000, lvl: 17, ap: 140000, category: 'realty' },
  { id: 'house', name: '🏡 Дом', cena: 1200000, lvl: 19, ap: 280000, category: 'realty' },
  { id: 'villa', name: '🏰 Вилла', cena: 3000000, lvl: 22, ap: 700000, category: 'realty' },
  { id: 'luxury_car', name: '🏎️ Люксовая тачка', cena: 5000000, lvl: 25, ap: 1200000, category: 'auto' }
];

var gotovHotLot = null;
var vremyaHotLota = 0;
var akciyaCateg = null;
var vremyaAkcii = 0;

function vkDostupen() {
  return typeof vkBridge !== 'undefined' && vkBridge && typeof vkBridge.send === 'function';
}

if (vkDostupen()) {
  vkBridge.send('VKWebAppInit').catch(function() {});
  vkBridge.send('VKWebAppGetUserInfo')
    .then(function(u) { user = u; render(); })
    .catch(function() { user = { id: 0, first_name: 'Гость', last_name: '' }; render(); });
} else {
  user = { id: 0, first_name: 'Гость', last_name: '' };
}

function trebOpyt(dlyaUrovnya) {
  if (dlyaUrovnya <= 1) return 0;
  if (dlyaUrovnya <= 20) return Math.floor(1000 * Math.pow(1.5, dlyaUrovnya - 1));
  var base = Math.floor(1000 * Math.pow(1.5, 19));
  var sverh = dlyaUrovnya - 20;
  return base + Math.floor(1000 * Math.pow(3.5, sverh));
}

function opytDlyaSledLvl() { return trebOpyt(lvl + 1) - trebOpyt(lvl); }

function progressLvl() {
  var tek = opyt - trebOpyt(lvl);
  var nuzhno = opytDlyaSledLvl();
  if (nuzhno <= 0) return 0;
  var p = tek / nuzhno * 100;
  if (p < 0) p = 0;
  if (p > 100) p = 100;
  return p;
}

function dobavitOpyt(skolko) {
  opyt += skolko;
  var povysheniya = 0;
  while (opyt >= trebOpyt(lvl + 1)) {
    lvl++;
    povysheniya++;
    maxEnerg += 2;
    if (povysheniya > 50) break;
  }
  if (povysheniya > 0) {
    energ = maxEnerg;
    proveritDostizheniya();
    toast('🎉 Уровень ' + lvl + '! +' + (povysheniya * 2) + ' энергии', 'gold');
  }
}

function toast(msg, tip) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  if (tip == 'ok') t.style.background = '#2a5';
  else if (tip == 'err') t.style.background = '#a33';
  else if (tip == 'gold') t.style.background = '#a80';
  else t.style.background = '#444';
  setTimeout(function() { t.className = 'toast'; }, 2000);
}

function primenitTemu() {
  if (tema == 'light') document.body.classList.add('light');
  else document.body.classList.remove('light');
}

function sohranit() {
  localStorage.setItem('perekup', JSON.stringify({
    dengi: dengi, lvl: lvl, opyt: opyt,
    energ: energ, maxEnerg: maxEnerg,
    inv: inv, loty: loty, dolg: dolg,
    poslBonus: poslBonus, seriyaDney: seriyaDney, poslRul: poslRul,
    activeSkin: activeSkin, dostizheniya: dostizheniya,
    kupilVsego: kupilVsego, prodalVsego: prodalVsego,
    jackpotVyl: jackpotVyl, tema: tema
  }));
}

function zagruzit() {
  var s = localStorage.getItem('perekup');
  if (s) {
    try {
      var d = JSON.parse(s);
      if (d.dengi != null) dengi = d.dengi;
      if (d.lvl) lvl = d.lvl;
      if (d.opyt != null) opyt = d.opyt;
      if (d.energ != null) energ = d.energ;
      if (d.maxEnerg) maxEnerg = d.maxEnerg;
      if (d.inv) inv = d.inv;
      if (d.loty) loty = d.loty;
      if (d.dolg) dolg = d.dolg;
      if (d.poslBonus) poslBonus = d.poslBonus;
      if (d.seriyaDney) seriyaDney = d.seriyaDney;
      if (d.poslRul) poslRul = d.poslRul;
      if (d.activeSkin) activeSkin = d.activeSkin;
      if (d.dostizheniya) {
        for (var i = 0; i < d.dostizheniya.length; i++) {
          for (var j = 0; j < dostizheniya.length; j++) {
            if (dostizheniya[j].id == d.dostizheniya[i].id) {
              dostizheniya[j].done = d.dostizheniya[i].done;
            }
          }
        }
      }
      if (d.kupilVsego) kupilVsego = d.kupilVsego;
      if (d.prodalVsego) prodalVsego = d.prodalVsego;
      if (d.jackpotVyl) jackpotVyl = d.jackpotVyl;
      if (d.tema) tema = d.tema;
    } catch(e) {}
  }
}

function randomCena(baza) {
  var x = 0.85 + Math.random() * 0.3;
  return Math.floor(baza * x);
}

function minCenaTovara(item) { return Math.floor(item.cena * 0.7); }
function maxCenaTovara(item) { return Math.floor(item.cena * 2.5); }

function naytiTovar(itemId) {
  for (var i = 0; i < tovari.length; i++) if (tovari[i].id == itemId) return tovari[i];
  return null;
}

function rasschitatShansICena(l, item) {
  var minC = minCenaTovara(item);
  var maxC = maxCenaTovara(item);
  var diap = maxC - minC;
  var otklonenie = (l.moyaCena - minC) / diap;
  if (otklonenie < 0) otklonenie = 0;
  if (otklonenie > 1) otklonenie = 1;

  var shans = 95 - otklonenie * 85;
  var vremya = 5 + otklonenie * 55;

  l.shansProdagy = Math.round(shans);
  l.vremyaOzhidaniya = Math.round(vremya * 1000);
  l.vremyaStart = Date.now();
  l.vremya = l.vremyaStart + l.vremyaOzhidaniya;
}

function proveritDostizheniya() {
  for (var i = 0; i < dostizheniya.length; i++) {
    var d = dostizheniya[i];
    if (d.done) continue;
    var vypolnil = false;
    if (d.id == 'first_buy' && kupilVsego >= 1) vypolnil = true;
    if (d.id == 'first_sell' && prodalVsego >= 1) vypolnil = true;
    if (d.id == 'sell_10' && prodalVsego >= 10) vypolnil = true;
    if (d.id == 'sell_50' && prodalVsego >= 50) vypolnil = true;
    if (d.id == 'sell_200' && prodalVsego >= 200) vypolnil = true;
    if (d.id == 'lvl_5' && lvl >= 5) vypolnil = true;
    if (d.id == 'lvl_10' && lvl >= 10) vypolnil = true;
    if (d.id == 'lvl_20' && lvl >= 20) vypolnil = true;
    if (d.id == 'money_10k' && dengi >= 10000) vypolnil = true;
    if (d.id == 'money_100k' && dengi >= 100000) vypolnil = true;
    if (d.id == 'money_1m' && dengi >= 1000000) vypolnil = true;
    if (d.id == 'roulette_win' && jackpotVyl) vypolnil = true;

    if (vypolnil) {
      d.done = true;
      dengi += d.reward;
      setTimeout(function(name, r) {
        return function() { toast('🏅 ' + name + ' +' + r + '₽', 'gold'); };
      }(d.name, d.reward), 500);
    }
  }
}

function kupit(itemId) {
  var item = naytiTovar(itemId);
  if (!item) return;
  if (item.lvl > lvl) { toast('🔒 Нужен уровень ' + item.lvl, 'err'); return; }
  var cena = randomCena(item.cena);
  if (dengi < cena) { toast('💸 Мало денег', 'err'); return; }
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  dengi = dengi - cena;
  energ = energ - 1;
  inv.push({
    uid: Date.now() + Math.random(),
    itemId: item.id,
    kupCena: cena,
    ap: 0
  });
  kupilVsego++;
  dobavitOpyt(Math.floor(cena / 50));
  proveritDostizheniya();
  toast('✅ Куплено за ' + cena + '₽', 'ok');
  sohranit();
  render();
}

function kupitHotLot() {
  if (!gotovHotLot) return;
  if (dengi < gotovHotLot.cena) { toast('💸 Мало денег', 'err'); return; }
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  dengi = dengi - gotovHotLot.cena;
  energ = energ - 1;
  inv.push({
    uid: Date.now() + Math.random(),
    itemId: gotovHotLot.item.id,
    kupCena: gotovHotLot.cena,
    ap: 0,
    hot: true
  });
  kupilVsego++;
  dobavitOpyt(Math.floor(gotovHotLot.cena / 50));
  proveritDostizheniya();
  toast('🔥 Горячий лот куплен за ' + gotovHotLot.cena + '₽!', 'gold');
  gotovHotLot = null;
  sohranit();
  render();
}

function apnut(uid) {
  var moy = null;
  for (var i = 0; i < inv.length; i++) if (inv[i].uid == uid) moy = inv[i];
  if (!moy) return;
  var item = naytiTovar(moy.itemId);
  var stoimost = Math.floor(item.ap * (1 + moy.ap * 0.5));
  if (dengi < stoimost) { toast('💸 Мало денег', 'err'); return; }
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  dengi = dengi - stoimost;
  energ = energ - 1;
  moy.ap = moy.ap + 1;
  dobavitOpyt(Math.floor(stoimost / 100));
  toast('🔧 Улучшено до +' + moy.ap, 'ok');
  sohranit();
  render();
}

function vystavitLot(uid) {
  var idx = -1;
  for (var i = 0; i < inv.length; i++) if (inv[i].uid == uid) idx = i;
  if (idx == -1) return;
  var moy = inv[idx];
  var item = naytiTovar(moy.itemId);
  var minC = minCenaTovara(item);
  var maxC = maxCenaTovara(item);

  var vvod = prompt(
    '💰 Выставь свою цену\n\n' +
    'Можно от ' + minC + ' до ' + maxC + '₽\n\n' +
    '💡 Дешёвая цена — быстрая продажа\n' +
    '💡 Дорогая — долго ждать и риск провала',
    minC
  );

  if (vvod === null) return;
  var moyaCena = parseInt(vvod);
  if (isNaN(moyaCena)) { toast('❌ Введи число!', 'err'); return; }
  if (moyaCena < minC) { toast('📉 Слишком дёшево! Мин: ' + minC, 'err'); return; }
  if (moyaCena > maxC) { toast('📈 Слишком дорого! Макс: ' + maxC, 'err'); return; }

  inv.splice(idx, 1);
  var lot = {
    uid: Date.now() + Math.random(),
    itemId: moy.itemId,
    kupCena: moy.kupCena,
    ap: moy.ap,
    moyaCena: moyaCena,
    vremyaStart: Date.now()
  };
  rasschitatShansICena(lot, item);
  loty.push(lot);
  toast('🏷️ Лот за ' + moyaCena + '₽', 'ok');
  sohranit();
  render();
}

function zabratLot(uid) {
  var idx = -1;
  for (var i = 0; i < loty.length; i++) if (loty[i].uid == uid) idx = i;
  if (idx == -1) return;
  var l = loty[idx];
  inv.push({
    uid: Date.now() + Math.random(),
    itemId: l.itemId,
    kupCena: l.kupCena,
    ap: l.ap
  });
  loty.splice(idx, 1);
  toast('↩️ Лот снят', 'ok');
  sohranit();
  render();
}

function prodatLot(uid) {
  var idx = -1;
  for (var i = 0; i < loty.length; i++) if (loty[i].uid == uid) idx = i;
  if (idx == -1) return;
  var l = loty[idx];
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  var shans = l.shansProdagy || 50;
  var prodano = Math.random() * 100 < shans;
  energ = energ - 1;

  if (prodano) {
    dengi = dengi + l.moyaCena;
    var prof = l.moyaCena - l.kupCena;
    loty.splice(idx, 1);
    prodalVsego++;
    dobavitOpyt(Math.floor(l.moyaCena / 50));
    proveritDostizheniya();
    toast('💰 Продано за ' + l.moyaCena + '₽ (' + (prof >= 0 ? '+' : '') + prof + ')', 'ok');
  } else {
    var item = naytiTovar(l.itemId);
    rasschitatShansICena(l, item);
    toast('😕 Не купили! Ждать заново: ' + Math.round(l.vremyaOzhidaniya / 1000) + ' сек', 'err');
  }
  sohranit();
  render();
}

function prodatMgnovenno(uid) {
  var idx = -1;
  for (var i = 0; i < inv.length; i++) if (inv[i].uid == uid) idx = i;
  if (idx == -1) return;
  var moy = inv[idx];
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  var bazaProd = moy.kupCena * (1 + moy.ap * 0.4);
  var cenaProd = Math.floor(bazaProd * 0.75);
  var prof = cenaProd - moy.kupCena;

  dengi = dengi + cenaProd;
  energ = energ - 1;
  inv.splice(idx, 1);
  prodalVsego++;
  dobavitOpyt(Math.floor(cenaProd / 100));
  proveritDostizheniya();
  toast('⚡ Срочно: ' + cenaProd + '₽ (' + (prof >= 0 ? '+' : '') + prof + ')', prof >= 0 ? 'ok' : 'err');
  sohranit();
  render();
}

function vzyatBonus() {
  var now = Date.now();
  var sutki = 24 * 60 * 60 * 1000;
  if (now - poslBonus < sutki) {
    var chas = Math.ceil((sutki - (now - poslBonus)) / (60 * 60 * 1000));
    toast('⏳ Бонус через ' + chas + ' ч.', 'err');
    return;
  }
  if (now - poslBonus > sutki * 2) seriyaDney = 0;
  seriyaDney++;
  if (seriyaDney > 7) seriyaDney = 7;
  var summy = [300, 500, 800, 1200, 1800, 2500, 5000];
  var bonus = summy[seriyaDney - 1];
  dengi += bonus;
  poslBonus = now;
  dobavitOpyt(50);
  toast('🎁 День ' + seriyaDney + ': +' + bonus + '₽!', 'gold');
  sohranit();
  render();
}

function krutitRuleku() {
  var now = Date.now();
  var sutki = 24 * 60 * 60 * 1000;
  if (now - poslRul < sutki) {
    var chas = Math.ceil((sutki - (now - poslRul)) / (60 * 60 * 1000));
    toast('⏳ Рулетка через ' + chas + ' ч.', 'err');
    return;
  }
  if (dengi < 500) { toast('💸 Нужно минимум 500₽', 'err'); return; }

  dengi -= 500;
  poslRul = now;

  var prizes = [
    { v: 0, w: 25, name: '😢 Ничего', ok: false },
    { v: 200, w: 25, name: '💰 200₽', ok: true },
    { v: 500, w: 20, name: '💰 500₽', ok: true },
    { v: 1000, w: 15, name: '💰 1000₽', ok: true },
    { v: 3000, w: 10, name: '🔥 3000₽', ok: true },
    { v: 10000, w: 4, name: '💎 ДЖЕКПОТ 10000₽', ok: true },
    { v: -2000, w: 1, name: '💀 БОМЖ -2000₽', ok: false }
  ];

  var total = 0;
  for (var i = 0; i < prizes.length; i++) total += prizes[i].w;
  var rnd = Math.random() * total;
  var sum = 0;
  var vyigral = prizes[0];
  for (var j = 0; j < prizes.length; j++) {
    sum += prizes[j].w;
    if (rnd <= sum) { vyigral = prizes[j]; break; }
  }

  dengi += vyigral.v;
  if (dengi < 0) dengi = 0;
  if (vyigral.v == 10000) { jackpotVyl = true; proveritDostizheniya(); }
  toast('🎰 ' + vyigral.name, vyigral.ok ? 'gold' : 'err');
  sohranit();
  render();
}

function vzyatKredit(summy) {
  if (dolg > 0) { toast('❌ Уже есть долг', 'err'); return; }
  var maxK = 5000 + lvl * 3000;
  if (summy > maxK) { toast('❌ Максимум ' + maxK + '₽', 'err'); return; }
  dengi += summy;
  dolg = Math.floor(summy * 1.3);
  toast('🏦 Взял ' + summy + '₽. Вернуть: ' + dolg + '₽', 'ok');
  sohranit();
  render();
}

function oplatitDolg() {
  if (dolg <= 0) return;
  if (dengi < dolg) { toast('💸 Не хватает ' + (dolg - dengi) + '₽', 'err'); return; }
  dengi -= dolg;
  toast('✅ Долг погашен: ' + dolg + '₽', 'ok');
  dolg = 0;
  sohranit();
  render();
}

function kupitSkin(id) {
  var sk = null;
  for (var i = 0; i < skiny.length; i++) if (skiny[i].id == id) sk = skiny[i];
  if (!sk) return;
  if (dengi < sk.price) { toast('💸 Мало денег', 'err'); return; }
  if (sk.price > 0) {
    dengi -= sk.price;
    toast('💼 Куплен скин: ' + sk.name, 'gold');
  }
  activeSkin = sk.id;
  sohranit();
  render();
}

function pereklTemu() {
  if (tema == 'dark') tema = 'light';
  else tema = 'dark';
  primenitTemu();
  sohranit();
  render();
}

function sbrosProgressa() {
  if (!confirm('⚠️ ТОЧНО сбросить прогресс?\n\nВсё будет потеряно: деньги, товары, лоты, уровень, достижения.')) return;
  if (!confirm('⚠️ Последнее предупреждение!\n\nЭто нельзя отменить. Точно сбросить?')) return;

  localStorage.removeItem('perekup');

  dengi = 1000;
  lvl = 1;
  opyt = 0;
  energ = 20;
  maxEnerg = 20;
  inv = [];
  loty = [];
  dolg = 0;
  activeSkin = '👤';
  poslBonus = 0;
  seriyaDney = 0;
  poslRul = 0;
  kupilVsego = 0;
  prodalVsego = 0;
  jackpotVyl = false;

  for (var i = 0; i < dostizheniya.length; i++) dostizheniya[i].done = false;

  toast('🗑️ Прогресс сброшен', 'ok');
  sohranit();
  render();
}

function escapeHtml(s) {
  s = String(s);
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function sekDoProdazhi(l) {
  var proshlo = Date.now() - l.vremyaStart;
  var ostalos = l.vremyaOzhidaniya - proshlo;
  if (ostalos < 0) ostalos = 0;
  return Math.ceil(ostalos / 1000);
}

function obnovitHotLot() {
  if (Date.now() - vremyaHotLota > 5 * 60 * 1000) {
    var dost = [];
    for (var i = 0; i < tovari.length; i++) if (tovari[i].lvl <= lvl) dost.push(tovari[i]);
    if (dost.length == 0) return;
    var it = dost[Math.floor(Math.random() * dost.length)];
    gotovHotLot = {
      item: it,
      cena: Math.floor(it.cena * 0.5),
      uid: Date.now()
    };
    vremyaHotLota = Date.now();
  }
}

function obnovitAkciyu() {
  if (Date.now() - vremyaAkcii > 60 * 60 * 1000) {
    var cats = ['tech', 'clothes', 'music', 'auto', 'realty'];
    akciyaCateg = cats[Math.floor(Math.random() * cats.length)];
    vremyaAkcii = Date.now();
  }
}

function nazvanieCateg(c) {
  if (c == 'tech') return '📱 Техника';
  if (c == 'clothes') return '👟 Одежда';
  if (c == 'music') return '🎸 Музыка';
  if (c == 'auto') return '🚗 Авто';
  if (c == 'realty') return '🏠 Недвижимость';
  return c;
}

function formatChislo(n) {
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function render() {
  obnovitHotLot();
  obnovitAkciyu();
  primenitTemu();

  document.getElementById('balance').textContent = formatChislo(dengi) + ' ₽';
  document.getElementById('level').textContent = lvl;
  document.getElementById('energy').textContent = energ + '/' + maxEnerg;

  var c = document.getElementById('content');

  if (tab == 'market') {
    var html = '';

    html += '<div class="card">';
    html += '<div class="card-name">📊 Прогресс уровня ' + lvl;
    html += '<div class="card-meta">Опыт: ' + opyt + ' / ' + trebOpyt(lvl + 1) + '</div>';
    html += '<div class="lvl-bar"><div class="lvl-bar-in" style="width:' + progressLvl() + '%"></div></div>';
    html += '</div>';

    if (dolg > 0) {
      html += '<div class="banner" style="background:linear-gradient(135deg,#4a0000,#6a0000);border-color:#ff6666">🏦 Долг: ' + formatChislo(dolg) + '₽</div>';
    }

    if (akciyaCateg) {
      html += '<div class="banner">📈 Акция: ' + nazvanieCateg(akciyaCateg) + ' +30%</div>';
    }

    if (gotovHotLot) {
      html += '<div class="card gold">';
      html += '<div class="card-row">';
      html += '<div class="card-info">';
      html += '<div class="card-name">🔥 ГОРЯЧИЙ ЛОТ (−50%)</div>';
      html += '<div class="card-meta">' + gotovHotLot.item.name + '</div>';
      html += '</div>';
      html += '<div class="card-price">' + formatChislo(gotovHotLot.cena) + ' ₽</div>';
      html += '</div>';
      html += '<button class="btn gold full" onclick="kupitHotLot()">🔥 Купить срочно!</button>';
      html += '</div>';
    }

    for (var i = 0; i < tovari.length; i++) {
      var it = tovari[i];
      var zakr = it.lvl > lvl;
      var cena = randomCena(it.cena);
      if (akciyaCateg && it.category == akciyaCateg) cena = Math.floor(cena * 1.3);
      var knopka = '';
      if (zakr || dengi < cena) {
        knopka = '<button class="btn" disabled>Купить</button>';
      } else {
        knopka = '<button class="btn" onclick="kupit(\'' + it.id + '\')">Купить</button>';
      }
      html += '<div class="card"><div class="card-row">';
      html += '<div class="card-info">';
      html += '<div class="card-name">' + it.name + (zakr ? ' 🔒' : '') + '</div>';
      html += '<div class="card-meta">Ур. ' + it.lvl + ' · Базовая: ' + formatChislo(it.cena) + '₽</div>';
      html += '</div>';
      html += '<div class="card-price">~' + formatChislo(cena) + ' ₽</div>';
      html += knopka;
      html += '</div></div>';
    }
    c.innerHTML = html;
  } else if (tab == 'inventory') {
    if (inv.length == 0) { c.innerHTML = '<div class="empty">📦 Пусто. Купи что-нибудь!</div>'; return; }
    var h = '';
    for (var m2 = 0; m2 < inv.length; m2++) {
      var m = inv[m2];
      var tovar = naytiTovar(m.itemId);
      if (!tovar) continue;
      var apCena = Math.floor(tovar.ap * (1 + m.ap * 0.5));
      var minC = minCenaTovara(tovar);
      var maxC = maxCenaTovara(tovar);
      h += '<div class="card">';
      h += '<div class="card-row">';
      h += '<div class="card-info">';
      h += '<div class="card-name">' + tovar.name + (m.ap > 0 ? ' +' + m.ap : '') + '</div>';
      h += '<div class="card-meta">Куплено: ' + formatChislo(m.kupCena) + '₽</div>';
      h += '<div class="card-meta">Диапазон: ' + formatChislo(minC) + '–' + formatChislo(maxC) + '₽</div>';
      h += '</div></div>';
      h += '<div class="card-row" style="margin-top:8px">';
      h += '<button class="btn small" onclick="apnut(' + m.uid + ')">🔧 ' + formatChislo(apCena) + '₽</button>';
      h += '<button class="btn small green" onclick="vystavitLot(' + m.uid + ')">🏷️ Выставить</button>';
      h += '<button class="btn small" onclick="prodatMgnovenno(' + m.uid + ')">⚡ Срочно</button>';
      h += '</div></div>';
    }
    c.innerHTML = h;
  } else if (tab == 'lots') {
    if (loty.length == 0) {
      c.innerHTML = '<div class="empty">🏷️ Нет активных лотов<br><br>Выстави товар из сумки</div>';
      return;
    }
    var hl = '<div class="lot-hint">💡 Дешёвая цена → быстро и надёжно. Дорогая → долго и рискованно.</div>';
    for (var w = 0; w < loty.length; w++) {
      var l = loty[w];
      var t2 = naytiTovar(l.itemId);
      var sek = sekDoProdazhi(l);
      var gotov = sek <= 0;
      var shans = l.shansProdagy || 50;
      var progress = 0;
      if (l.vremyaOzhidaniya > 0) {
        progress = 100 - (sek * 1000 / l.vremyaOzhidaniya) * 100;
        if (progress < 0) progress = 0;
        if (progress > 100) progress = 100;
      }
      hl += '<div class="card">';
      hl += '<div class="card-row">';
      hl += '<div class="card-info">';
      hl += '<div class="card-name">' + t2.name + (l.ap > 0 ? ' +' + l.ap : '') + '</div>';
      hl += '<div class="card-meta">Куплено: ' + formatChislo(l.kupCena) + '₽</div>';
      if (gotov) hl += '<div class="lot-chance">✅ Готов · шанс ' + shans + '%</div>';
      else hl += '<div class="lot-timer">⏳ ' + sek + ' сек · шанс ' + shans + '%</div>';
      hl += '</div>';
      hl += '<div class="card-price">' + formatChislo(l.moyaCena) + ' ₽</div>';
      hl += '</div>';
      hl += '<div class="lot-bar"><div class="lot-bar-in" style="width:' + progress + '%"></div></div>';
      hl += '<div class="card-row" style="margin-top:8px">';
      if (gotov) hl += '<button class="btn small green" onclick="prodatLot(' + l.uid + ')">💰 Продать (' + shans + '%)</button>';
      else hl += '<button class="btn small" disabled>⏳ ' + sek + ' сек</button>';
      hl += '<button class="btn small red" onclick="zabratLot(' + l.uid + ')">↩️ Снять</button>';
      hl += '</div></div>';
    }
    c.innerHTML = hl;
  } else if (tab == 'roulette') {
    var now = Date.now();
    var sutki = 24 * 60 * 60 * 1000;
    var gotovR = (now - poslRul) >= sutki;
    var hr = '<div class="roulette-box">';
    hr += '<div class="roulette-icon">🎰</div>';
    hr += '<div style="font-size:14px;margin-bottom:8px">Крути рулетку раз в день!</div>';
    hr += '<div style="font-size:11px;color:#aaa;margin-bottom:10px">Ставка: 500₽</div>';
    hr += '<div style="font-size:11px;color:#aaa;margin-bottom:10px">Призы: 0, 200, 500, 1000, 3000, 10000, −2000</div>';
    if (gotovR) hr += '<button class="btn gold full" onclick="krutitRuleku()">🎰 КРУТИТЬ!</button>';
    else {
      var chas = Math.ceil((sutki - (now - poslRul)) / (60 * 60 * 1000));
      hr += '<button class="btn full" disabled>⏳ Через ' + chas + ' ч.</button>';
    }
    hr += '</div>';

    var now2 = Date.now();
    var gotovB = (now2 - poslBonus) >= sutki;
    hr += '<div class="card gold">';
    hr += '<div class="card-name" style="margin-bottom:6px">🎁 Ежедневный бонус</div>';
    hr += '<div class="card-meta">Серия: ' + seriyaDney + '/7 дней</div>';
    hr += '<div class="card-meta">300, 500, 800, 1200, 1800, 2500, 5000₽</div>';
    if (gotovB) hr += '<button class="btn gold full" onclick="vzyatBonus()">🎁 Забрать бонус</button>';
    else {
      var chas2 = Math.ceil((sutki - (now2 - poslBonus)) / (60 * 60 * 1000));
      hr += '<button class="btn full" disabled>⏳ Через ' + chas2 + ' ч.</button>';
    }
    hr += '</div>';
    c.innerHTML = hr;
  } else if (tab == 'bank') {
    var maxK = 5000 + lvl * 3000;
    var hb = '';
    hb += '<div class="card">';
    hb += '<div class="card-name" style="margin-bottom:8px">🏦 Банк "ПерекуП"</div>';
    hb += '<div class="card-meta">Возврат: +30%</div>';
    if (dolg > 0) {
      hb += '<div class="card-meta" style="color:#ff6666;margin-top:6px">💸 Долг: ' + formatChislo(dolg) + '₽</div>';
      hb += '<button class="btn green full" onclick="oplatitDolg()">✅ Погасить (' + formatChislo(dolg) + '₽)</button>';
    } else {
      hb += '<div class="card-meta">Максимум: ' + formatChislo(maxK) + '₽</div>';
    }
    hb += '</div>';

    if (dolg == 0) {
      var summy = [1000, 5000, 20000, 50000, maxK];
      for (var s2 = 0; s2 < summy.length; s2++) {
        var sm = summy[s2];
        if (sm > maxK) continue;
        hb += '<div class="card"><div class="card-row">';
        hb += '<div class="card-info">';
        hb += '<div class="card-name">Взять ' + formatChislo(sm) + '₽</div>';
        hb += '<div class="card-meta">Вернуть: ' + formatChislo(Math.floor(sm * 1.3)) + '₽</div>';
        hb += '</div>';
        hb += '<button class="btn" onclick="vzyatKredit(' + sm + ')">Взять</button>';
        hb += '</div></div>';
      }
    }
    c.innerHTML = hb;
  } else if (tab == 'ach') {
    var ha = '';
    var vypolneno = 0;
    for (var a = 0; a < dostizheniya.length; a++) {
      var d = dostizheniya[a];
      if (d.done) vypolneno++;
      ha += '<div class="ach' + (d.done ? ' done' : '') + '">';
      ha += '<div class="ach-icon">' + d.icon + '</div>';
      ha += '<div class="ach-info">';
      ha += '<div class="ach-name">' + d.name + '</div>';
      ha += '<div class="ach-desc">' + d.desc + '</div>';
      ha += '</div>';
      ha += '<div class="ach-reward">' + (d.done ? '✅ +' : '+') + formatChislo(d.reward) + '₽</div>';
      ha += '</div>';
    }
    ha = '<div class="lot-refresh" style="margin-bottom:10px">🏅 Выполнено: ' + vypolneno + '/' + dostizheniya.length + '</div>' + ha;
    c.innerHTML = ha;
  } else if (tab == 'skins') {
    var hs = '<div class="lot-refresh">💼 Выбери скин</div>';
    for (var sk = 0; sk < skiny.length; sk++) {
      var s3 = skiny[sk];
      hs += '<div class="skin' + (activeSkin == s3.id ? ' active' : '') + '">';
      hs += '<div class="skin-icon">' + s3.id + '</div>';
      hs += '<div class="skin-info">';
      hs += '<div class="skin-name">' + s3.name + '</div>';
      hs += '<div class="card-meta">' + (s3.price == 0 ? 'Бесплатно' : formatChislo(s3.price) + '₽') + '</div>';
      hs += '</div>';
      if (activeSkin == s3.id) hs += '<div class="ach-reward">✅ Выбран</div>';
      else if (dengi >= s3.price) hs += '<button class="btn small" onclick="kupitSkin(\'' + s3.id + '\')">' + (s3.price == 0 ? 'Выбрать' : 'Купить') + '</button>';
      else hs += '<button class="btn small" disabled>Нет денег</button>';
      hs += '</div>';
    }
    c.innerHTML = hs;
  } else if (tab == 'settings') {
    var hst = '';
    hst += '<div class="setting-row">';
    hst += '<div class="setting-info">';
    hst += '<div class="setting-name">🌗 Тёмная тема</div>';
    hst += '<div class="setting-desc">' + (tema == 'dark' ? 'Включена' : 'Выключена') + '</div>';
    hst += '</div>';
    hst += '<div class="switch' + (tema == 'dark' ? ' on' : '') + '" onclick="pereklTemu()"></div>';
    hst += '</div>';

    hst += '<div class="setting-row">';
    hst += '<div class="setting-info">';
    hst += '<div class="setting-name">📊 Статистика</div>';
    hst += '<div class="setting-desc">Куплено: ' + kupilVsego + ' · Продано: ' + prodalVsego + ' · Уровень: ' + lvl + '</div>';
    hst += '</div>';
    hst += '</div>';

    hst += '<div class="card red">';
    hst += '<div class="card-name" style="margin-bottom:8px">🗑️ Сброс прогресса</div>';
    hst += '<div class="card-meta">Удалить всё: деньги, товары, лоты, уровень, достижения. Начать с нуля.</div>';
    hst += '<button class="btn red full" onclick="sbrosProgressa()">🗑️ Сбросить прогресс</button>';
    hst += '</div>';

    hst += '<div class="card">';
    hst += '<div class="card-name" style="margin-bottom:6px">ℹ️ О игре</div>';
    hst += '<div class="card-meta">ПерекуП — симулятор перекупа. Покупай дешевле, продавай дороже, стань магнатом.</div>';
    hst += '<div class="card-meta" style="margin-top:6px">Версия: 1.0</div>';
    hst += '</div>';

    c.innerHTML = hst;
  }
}

var vseTaby = document.querySelectorAll('.tab');
for (var i = 0; i < vseTaby.length; i++) {
  vseTaby[i].onclick = function() {
    for (var j = 0; j < vseTaby.length; j++) vseTaby[j].classList.remove('active');
    this.classList.add('active');
    tab = this.getAttribute('data-tab');
    render();
  };
}

zagruzit();
primenitTemu();
render();

setInterval(function() {
  if (energ < maxEnerg) {
    energ = energ + 1;
    sohranit();
    render();
  }
}, 60000);

setInterval(function() {
  if (tab == 'lots' || tab == 'market') render();
}, 1000);

setInterval(function() {
  proveritDostizheniya();
  sohranit();
}, 5000);
</script>
