<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ПерекуП</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #222;
    color: white;
    padding: 10px;
    padding-bottom: 80px;
  }
  .header {
    background: #333;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    text-align: center;
  }
  .header h1 { font-size: 18px; margin-bottom: 8px; }
  .stats { display: flex; justify-content: space-around; }
  .stat { font-size: 12px; }
  .stat b { display: block; font-size: 16px; color: #66ccff; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .tab {
    padding: 8px 10px;
    text-align: center;
    background: #333;
    border-radius: 8px;
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab.active { background: #66ccff; color: black; font-weight: bold; }

  .card {
    background: #333;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .card.gold {
    background: linear-gradient(135deg, #4a3a00, #6a5500);
    border: 2px solid gold;
  }
  .card.red {
    background: linear-gradient(135deg, #4a0000, #6a0000);
    border: 2px solid #ff6666;
  }
  .card.green {
    background: linear-gradient(135deg, #003a00, #006a00);
    border: 2px solid #66ff66;
  }

  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .card-info { flex: 1; }
  .card-name { font-size: 14px; margin-bottom: 4px; }
  .card-meta { font-size: 11px; color: #aaa; }
  .card-price { color: #66ff66; font-size: 14px; }

  .btn {
    background: #66ccff;
    color: black;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
  }
  .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
  .btn.green { background: #66ff66; }
  .btn.red { background: #ff6666; }
  .btn.gold { background: gold; }
  .btn.small { padding: 6px 10px; font-size: 11px; }
  .btn.full { width: 100%; padding: 10px; font-size: 13px; margin-top: 6px; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #444;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: 0.3s;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  .empty { text-align: center; padding: 30px; color: #888; font-size: 13px; }

  .lb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #333;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .lb-row.me {
    background: #2a4a6a;
    border: 2px solid #66ccff;
  }
  .lb-rank {
    font-size: 16px;
    font-weight: bold;
    min-width: 32px;
    text-align: center;
  }
  .lb-rank.gold { color: gold; }
  .lb-rank.silver { color: silver; }
  .lb-rank.bronze { color: #cd7f32; }
  .lb-info { flex: 1; }
  .lb-name { font-size: 14px; font-weight: bold; }
  .lb-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
  .lb-balance { color: #66ff66; font-weight: bold; font-size: 14px; }
  .lb-refresh {
    text-align: center;
    margin: 10px 0;
    font-size: 12px;
    color: #888;
  }

  .lot-bar {
    background: #222;
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
    margin-top: 6px;
  }
  .lot-bar-in {
    background: linear-gradient(90deg, #66ff66, #ffaa00);
    height: 100%;
    transition: width 0.5s;
  }
  .lot-timer { font-size: 11px; color: #ffaa00; margin-top: 4px; }
  .lot-hint { font-size: 10px; color: #888; margin-top: 4px; text-align: center; }
  .lot-chance { font-size: 11px; color: #66ccff; margin-top: 4px; }

  .banner {
    background: linear-gradient(135deg, #663300, #996600);
    border: 2px solid gold;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
  }

  .ach {
    background: #333;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ach.done { background: linear-gradient(135deg, #003a00, #006a00); border: 2px solid #66ff66; }
  .ach-icon { font-size: 24px; }
  .ach-info { flex: 1; }
  .ach-name { font-size: 13px; font-weight: bold; margin-bottom: 2px; }
  .ach-desc { font-size: 11px; color: #aaa; }
  .ach.done .ach-desc { color: #aaffaa; }
  .ach-reward { color: gold; font-size: 12px; font-weight: bold; }

  .skin {
    background: #333;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .skin.active { background: linear-gradient(135deg, #4a3a00, #6a5500); border: 2px solid gold; }
  .skin-icon { font-size: 24px; }
  .skin-info { flex: 1; }
  .skin-name { font-size: 13px; font-weight: bold; }

  .roulette-box {
    background: #333;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 10px;
  }
  .roulette-icon { font-size: 60px; margin-bottom: 10px; }
  .roulette-result { font-size: 16px; font-weight: bold; margin: 10px 0; }
</style>
</head>
<body>

<div class="header">
  <h1>💼 ПерекуП</h1>
  <div class="stats">
    <div class="stat">Баланс<b id="balance">1000 ₽</b></div>
    <div class="stat">Уровень<b id="level">1</b></div>
    <div class="stat">Энергия<b id="energy">20/20</b></div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="market">🛒 Рынок</div>
  <div class="tab" data-tab="inventory">📦 Сумка</div>
  <div class="tab" data-tab="lots">🏷️ Лоты</div>
  <div class="tab" data-tab="roulette">🎰 Рулетка</div>
  <div class="tab" data-tab="bank">🏦 Банк</div>
  <div class="tab" data-tab="ach">🏅 Награды</div>
  <div class="tab" data-tab="skins">💼 Скины</div>
  <div class="tab" data-tab="leaders">🏆 Топ</div>
</div>

<div id="content"></div>
<div class="toast" id="toast"></div>

<script>
var user = null;
var dengi = 1000;
var lvl = 1;
var energ = 20;
var maxEnerg = 20;
var inv = [];
var loty = [];
var dolg = 0;
var skin = '👤';
var tab = 'market';

var poslBonus = 0;
var seriyaDney = 0;
var poslRul = 0;
var activeSkin = '👤';

var dostizheniya = [
  { id: 'first_buy', name: 'Первая покупка', desc: 'Купи первый товар', icon: '🛒', reward: 100, done: false },
  { id: 'first_sell', name: 'Первая продажа', desc: 'Продай первый товар', icon: '💰', reward: 200, done: false },
  { id: 'sell_10', name: 'Десять сделок', desc: 'Продай 10 товаров', icon: '📈', reward: 1000, done: false },
  { id: 'sell_50', name: 'Перекуп-про', desc: 'Продай 50 товаров', icon: '🔥', reward: 5000, done: false },
  { id: 'lvl_5', name: 'Пятый уровень', desc: 'Достигни 5 уровня', icon: '⭐', reward: 2000, done: false },
  { id: 'lvl_10', name: 'Десятый уровень', desc: 'Достигни 10 уровня', icon: '🌟', reward: 10000, done: false },
  { id: 'money_10k', name: 'Первые 10000', desc: 'Заработай 10000₽', icon: '💵', reward: 3000, done: false },
  { id: 'money_100k', name: 'Сто тысяч', desc: 'Заработай 100000₽', icon: '🏆', reward: 20000, done: false },
  { id: 'crash_test', name: 'Краденое', desc: 'Купи краденый товар', icon: '🕵️', reward: 500, done: false },
  { id: 'roulette_win', name: 'Джекпот', desc: 'Выиграй в рулетке 10000₽', icon: '🎰', reward: 5000, done: false }
];

var skiny = [
  { id: '👤', name: 'Обычный', price: 0 },
  { id: '💼', name: 'Бизнесмен', price: 1000 },
  { id: '🕶️', name: 'Крутой', price: 3000 },
  { id: '🎩', name: 'Магнат', price: 10000 },
  { id: '👑', name: 'Король рынка', price: 50000 },
  { id: '🤴', name: 'Император', price: 200000 }
];

var kupilVsego = 0;
var prodalVsego = 0;
var krashennoeKupil = false;
var jackpotVyl = false;

var tovari = [
  { id: 'phone', name: '📱 Старый телефон', cena: 300, lvl: 1, ap: 150, category: 'tech' },
  { id: 'sneak', name: '👟 Кроссовки', cena: 500, lvl: 1, ap: 200, category: 'clothes' },
  { id: 'bike', name: '🚲 Велосипед', cena: 1000, lvl: 2, ap: 400, category: 'tech' },
  { id: 'laptop', name: '💻 Ноутбук', cena: 2500, lvl: 3, ap: 900, category: 'tech' },
  { id: 'guitar', name: '🎸 Гитара', cena: 4000, lvl: 4, ap: 1200, category: 'music' },
  { id: 'car', name: '🚗 Машина', cena: 10000, lvl: 5, ap: 3000, category: 'auto' }
];

var tovariKrashennoe = [
  { id: 'k_phone', name: '📱 Телефон (левый)', cena: 150, ap: 100 },
  { id: 'k_watch', name: '⌚ Часы (левый)', cena: 300, ap: 200 },
  { id: 'k_laptop', name: '💻 Ноут (левый)', cena: 800, ap: 500 }
];

var gotovHotLot = null;
var vremyaHotLota = 0;
var akciyaCateg = null;
var vremyaAkcii = 0;

function vkDostupen() {
  return typeof vkBridge !== 'undefined' && vkBridge && typeof vkBridge.send === 'function';
}

if (vkDostupen()) {
  vkBridge.send('VKWebAppInit').catch(function() {});
  vkBridge.send('VKWebAppGetUserInfo')
    .then(function(u) { user = u; otpravScore(); render(); })
    .catch(function() { user = { id: 0, first_name: 'Гость', last_name: '' }; render(); });
} else {
  user = { id: 0, first_name: 'Гость', last_name: '' };
}

function toast(msg, tip) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  if (tip == 'ok') t.style.background = '#2a5';
  else if (tip == 'err') t.style.background = '#a33';
  else if (tip == 'gold') t.style.background = '#a80';
  else t.style.background = '#444';
  setTimeout(function() { t.className = 'toast'; }, 2000);
}

function sohranit() {
  localStorage.setItem('perekup', JSON.stringify({
    dengi: dengi, lvl: lvl, energ: energ, maxEnerg: maxEnerg,
    inv: inv, loty: loty, dolg: dolg,
    poslBonus: poslBonus, seriyaDney: seriyaDney, poslRul: poslRul,
    activeSkin: activeSkin, dostizheniya: dostizheniya,
    kupilVsego: kupilVsego, prodalVsego: prodalVsego,
    krashennoeKupil: krashennoeKupil, jackpotVyl: jackpotVyl
  }));
  otpravScore();
}

function zagruzit() {
  var s = localStorage.getItem('perekup');
  if (s) {
    try {
      var d = JSON.parse(s);
      if (d.dengi) dengi = d.dengi;
      if (d.lvl) lvl = d.lvl;
      if (d.energ) energ = d.energ;
      if (d.maxEnerg) maxEnerg = d.maxEnerg;
      if (d.inv) inv = d.inv;
      if (d.loty) loty = d.loty;
      if (d.dolg) dolg = d.dolg;
      if (d.poslBonus) poslBonus = d.poslBonus;
      if (d.seriyaDney) seriyaDney = d.seriyaDney;
      if (d.poslRul) poslRul = d.poslRul;
      if (d.activeSkin) activeSkin = d.activeSkin;
      if (d.dostizheniya) {
        for (var i = 0; i < d.dostizheniya.length; i++) {
          for (var j = 0; j < dostizheniya.length; j++) {
            if (dostizheniya[j].id == d.dostizheniya[i].id) {
              dostizheniya[j].done = d.dostizheniya[i].done;
            }
          }
        }
      }
      if (d.kupilVsego) kupilVsego = d.kupilVsego;
      if (d.prodalVsego) prodalVsego = d.prodalVsego;
      if (d.krashennoeKupil) krashennoeKupil = d.krashennoeKupil;
      if (d.jackpotVyl) jackpotVyl = d.jackpotVyl;
    } catch(e) {}
  }
}

function randomCena(baza) {
  var x = 0.85 + Math.random() * 0.3;
  return Math.floor(baza * x);
}

function minCenaTovara(item) { return Math.floor(item.cena * 0.7); }
function maxCenaTovara(item) { return Math.floor(item.cena * 2.5); }

function naytiTovar(itemId) {
  for (var i = 0; i < tovari.length; i++) if (tovari[i].id == itemId) return tovari[i];
  for (var k = 0; k < tovariKrashennoe.length; k++) if (tovariKrashennoe[k].id == itemId) return tovariKrashennoe[k];
  return null;
}

function rasschitatShansICena(l, item) {
  var minC = minCenaTovara(item);
  var maxC = maxCenaTovara(item);
  var diap = maxC - minC;
  var otklonenie = (l.moyaCena - minC) / diap;
  if (otklonenie < 0) otklonenie = 0;
  if (otklonenie > 1) otklonenie = 1;

  var shans = 95 - otklonenie * 85;
  var vremya = 5 + otklonenie * 55;

  l.shansProdagy = Math.round(shans);
  l.vremyaOzhidaniya = Math.round(vremya * 1000);
  l.vremyaStart = l.vremyaStart || Date.now();
  l.vremya = l.vremyaStart + l.vremyaOzhidaniya;
}

function proveritDostizheniya() {
  for (var i = 0; i < dostizheniya.length; i++) {
    var d = dostizheniya[i];
    if (d.done) continue;
    var vypolnil = false;
    if (d.id == 'first_buy' && kupilVsego >= 1) vypolnil = true;
    if (d.id == 'first_sell' && prodalVsego >= 1) vypolnil = true;
    if (d.id == 'sell_10' && prodalVsego >= 10) vypolnil = true;
    if (d.id == 'sell_50' && prodalVsego >= 50) vypolnil = true;
    if (d.id == 'lvl_5' && lvl >= 5) vypolnil = true;
    if (d.id == 'lvl_10' && lvl >= 10) vypolnil = true;
    if (d.id == 'money_10k' && dengi >= 10000) vypolnil = true;
    if (d.id == 'money_100k' && dengi >= 100000) vypolnil = true;
    if (d.id == 'crash_test' && krashennoeKupil) vypolnil = true;
    if (d.id == 'roulette_win' && jackpotVyl) vypolnil = true;

    if (vypolnil) {
      d.done = true;
      dengi += d.reward;
      setTimeout(function(name, r) {
        return function() { toast('🏅 ' + name + ' +' + r + '₽', 'gold'); };
      }(d.name, d.reward), 500);
    }
  }
}

function kupit(itemId) {
  var item = naytiTovar(itemId);
  if (!item) return;
  if (item.lvl && item.lvl > lvl) { toast('🔒 Нужен уровень ' + item.lvl, 'err'); return; }
  var cena = randomCena(item.cena);
  if (dengi < cena) { toast('💸 Мало денег', 'err'); return; }
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  dengi = dengi - cena;
  energ = energ - 1;
  inv.push({
    uid: Date.now() + Math.random(),
    itemId: item.id,
    kupCena: cena,
    ap: 0
  });
  kupilVsego++;
  proveritDostizheniya();
  toast('✅ Куплено за ' + cena + '₽', 'ok');
  sohranit();
  render();
}

function kupitKrashennoe(itemId) {
  var item = naytiTovar(itemId);
  if (!item) return;
  var cena = randomCena(item.cena);
  if (dengi < cena) { toast('💸 Мало денег', 'err'); return; }
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  if (Math.random() < 0.25) {
    var shtraf = Math.floor(cena * 2);
    dengi = dengi - shtraf;
    if (dengi < 0) dengi = 0;
    energ = energ - 1;
    toast('🚔 Полиция! Штраф ' + shtraf + '₽', 'err');
    sohranit();
    render();
    return;
  }

  dengi = dengi - cena;
  energ = energ - 1;
  inv.push({
    uid: Date.now() + Math.random(),
    itemId: item.id,
    kupCena: cena,
    ap: 0,
    krashennoe: true
  });
  kupilVsego++;
  krashennoeKupil = true;
  proveritDostizheniya();
  toast('🕵️ Куплено краденое за ' + cena + '₽', 'ok');
  sohranit();
  render();
}

function kupitHotLot() {
  if (!gotovHotLot) return;
  if (dengi < gotovHotLot.cena) { toast('💸 Мало денег', 'err'); return; }
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  dengi = dengi - gotovHotLot.cena;
  energ = energ - 1;
  inv.push({
    uid: Date.now() + Math.random(),
    itemId: gotovHotLot.item.id,
    kupCena: gotovHotLot.cena,
    ap: 0,
    hot: true
  });
  kupilVsego++;
  proveritDostizheniya();
  toast('🔥 Горячий лот куплен за ' + gotovHotLot.cena + '₽!', 'gold');
  gotovHotLot = null;
  sohranit();
  render();
}

function apnut(uid) {
  var moy = null;
  for (var i = 0; i < inv.length; i++) if (inv[i].uid == uid) moy = inv[i];
  if (!moy) return;
  var item = naytiTovar(moy.itemId);
  var stoimost = Math.floor(item.ap * (1 + moy.ap * 0.5));
  if (dengi < stoimost) { toast('💸 Мало денег', 'err'); return; }
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  dengi = dengi - stoimost;
  energ = energ - 1;
  moy.ap = moy.ap + 1;
  toast('🔧 Улучшено до +' + moy.ap, 'ok');
  sohranit();
  render();
}

function vystavitLot(uid) {
  var idx = -1;
  for (var i = 0; i < inv.length; i++) if (inv[i].uid == uid) idx = i;
  if (idx == -1) return;
  var moy = inv[idx];
  var item = naytiTovar(moy.itemId);
  var minC = minCenaTovara(item);
  var maxC = maxCenaTovara(item);

  var vvod = prompt(
    '💰 Выставь свою цену\n\n' +
    'Можно от ' + minC + ' до ' + maxC + '₽\n\n' +
    '💡 Дешёвая цена — быстрая продажа\n' +
    '💡 Дорогая — долго ждать',
    minC
  );

  if (vvod === null) return;
  var moyaCena = parseInt(vvod);
  if (isNaN(moyaCena)) { toast('❌ Введи число!', 'err'); return; }
  if (moyaCena < minC) { toast('📉 Слишком дёшево! Мин: ' + minC, 'err'); return; }
  if (moyaCena > maxC) { toast('📈 Слишком дорого! Макс: ' + maxC, 'err'); return; }

  inv.splice(idx, 1);
  var lot = {
    uid: Date.now() + Math.random(),
    itemId: moy.itemId,
    kupCena: moy.kupCena,
    ap: moy.ap,
    moyaCena: moyaCena,
    vremyaStart: Date.now(),
    krashennoe: moy.krashennoe
  };
  rasschitatShansICena(lot, item);
  loty.push(lot);
  toast('🏷️ Лот за ' + moyaCena + '₽', 'ok');
  sohranit();
  render();
}

function zabratLot(uid) {
  var idx = -1;
  for (var i = 0; i < loty.length; i++) if (loty[i].uid == uid) idx = i;
  if (idx == -1) return;
  var l = loty[idx];
  inv.push({
    uid: Date.now() + Math.random(),
    itemId: l.itemId,
    kupCena: l.kupCena,
    ap: l.ap,
    krashennoe: l.krashennoe
  });
  loty.splice(idx, 1);
  toast('↩️ Лот снят', 'ok');
  sohranit();
  render();
}

function prodatLot(uid) {
  var idx = -1;
  for (var i = 0; i < loty.length; i++) if (loty[i].uid == uid) idx = i;
  if (idx == -1) return;
  var l = loty[idx];
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  if (l.krashennoe && Math.random() < 0.15) {

  render();
}
