<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ПерекуП</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #222;
    color: white;
    padding: 10px;
    padding-bottom: 80px;
  }
  .header {
    background: #333;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    text-align: center;
  }
  .header h1 { font-size: 18px; margin-bottom: 8px; }
  .stats { display: flex; justify-content: space-around; }
  .stat { font-size: 12px; }
  .stat b { display: block; font-size: 16px; color: #66ccff; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    background: #333;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  .tab.active { background: #66ccff; color: black; font-weight: bold; }

  .card {
    background: #333;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .card-info { flex: 1; }
  .card-name { font-size: 14px; margin-bottom: 4px; }
  .card-meta { font-size: 11px; color: #aaa; }
  .card-price { color: #66ff66; font-size: 14px; }

  .btn {
    background: #66ccff;
    color: black;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
  }
  .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
  .btn.green { background: #66ff66; }
  .btn.red { background: #ff6666; }
  .btn.small { padding: 6px 10px; font-size: 11px; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #444;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: 0.3s;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  .empty { text-align: center; padding: 30px; color: #888; font-size: 13px; }

  .lb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #333;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .lb-row.me {
    background: #2a4a6a;
    border: 2px solid #66ccff;
  }
  .lb-rank {
    font-size: 16px;
    font-weight: bold;
    min-width: 32px;
    text-align: center;
  }
  .lb-rank.gold { color: gold; }
  .lb-rank.silver { color: silver; }
  .lb-rank.bronze { color: #cd7f32; }
  .lb-info { flex: 1; }
  .lb-name { font-size: 14px; font-weight: bold; }
  .lb-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
  .lb-balance { color: #66ff66; font-weight: bold; font-size: 14px; }
  .lb-refresh {
    text-align: center;
    margin: 10px 0;
    font-size: 12px;
    color: #888;
  }

  .lot-bar {
    background: #222;
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
    margin-top: 6px;
  }
  .lot-bar-in {
    background: linear-gradient(90deg, #66ff66, #ffaa00);
    height: 100%;
    transition: width 0.5s;
  }
  .lot-timer {
    font-size: 11px;
    color: #ffaa00;
    margin-top: 4px;
  }
  .lot-hint {
    font-size: 10px;
    color: #888;
    margin-top: 4px;
    text-align: center;
  }
  .lot-chance {
    font-size: 11px;
    color: #66ccff;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>💼 ПерекуП</h1>
  <div class="stats">
    <div class="stat">Баланс<b id="balance">1000 ₽</b></div>
    <div class="stat">Уровень<b id="level">1</b></div>
    <div class="stat">Энергия<b id="energy">20/20</b></div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="market">🛒 Рынок</div>
  <div class="tab" data-tab="inventory">📦 Сумка</div>
  <div class="tab" data-tab="lots">🏷️ Лоты</div>
  <div class="tab" data-tab="leaders">🏆 Топ</div>
</div>

<div id="content"></div>
<div class="toast" id="toast"></div>

<script>
var user = null;
var dengi = 1000;
var lvl = 1;
var energ = 20;
var maxEnerg = 20;
var inv = [];
var loty = [];
var tab = 'market';

var tovari = [
  { id: 'phone', name: '📱 Старый телефон', cena: 300, lvl: 1, ap: 150 },
  { id: 'sneak', name: '👟 Кроссовки', cena: 500, lvl: 1, ap: 200 },
  { id: 'bike', name: '🚲 Велосипед', cena: 1000, lvl: 2, ap: 400 },
  { id: 'laptop', name: '💻 Ноутбук', cena: 2500, lvl: 3, ap: 900 },
  { id: 'car', name: '🚗 Машина', cena: 10000, lvl: 5, ap: 3000 }
];

function vkDostupen() {
  return typeof vkBridge !== 'undefined' && vkBridge && typeof vkBridge.send === 'function';
}

if (vkDostupen()) {
  vkBridge.send('VKWebAppInit').catch(function() {});
  vkBridge.send('VKWebAppGetUserInfo')
    .then(function(u) {
      user = u;
      otpravScore();
      render();
    })
    .catch(function() {
      user = { id: 0, first_name: 'Гость', last_name: '' };
      render();
    });
} else {
  user = { id: 0, first_name: 'Гость', last_name: '' };
}

function toast(msg, tip) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  if (tip == 'ok') t.style.background = '#2a5';
  else if (tip == 'err') t.style.background = '#a33';
  else t.style.background = '#444';
  setTimeout(function() { t.className = 'toast'; }, 1800);
}

function sohranit() {
  localStorage.setItem('perekup', JSON.stringify({
    dengi: dengi,
    lvl: lvl,
    energ: energ,
    maxEnerg: maxEnerg,
    inv: inv,
    loty: loty
  }));
  otpravScore();
}

function zagruzit() {
  var s = localStorage.getItem('perekup');
  if (s) {
    try {
      var d = JSON.parse(s);
      if (d.dengi) dengi = d.dengi;
      if (d.lvl) lvl = d.lvl;
      if (d.energ) energ = d.energ;
      if (d.maxEnerg) maxEnerg = d.maxEnerg;
      if (d.inv) inv = d.inv;
      if (d.loty) loty = d.loty;
    } catch(e) {}
  }
}

function randomCena(baza) {
  var x = 0.85 + Math.random() * 0.3;
  return Math.floor(baza * x);
}

function minCenaTovara(item) {
  return Math.floor(item.cena * 0.7);
}

function maxCenaTovara(item) {
  return Math.floor(item.cena * 2.5);
}

function rasschitatShansICena(l, item) {
  var minC = minCenaTovara(item);
  var maxC = maxCenaTovara(item);
  var diap = maxC - minC;
  var otklonenie = (l.moyaCena - minC) / diap;
  if (otklonenie < 0) otklonenie = 0;
  if (otklonenie > 1) otklonenie = 1;

  var shans = 95 - otklonenie * 85;
  var vremya = 5 + otklonenie * 55;

  l.shansProdagy = Math.round(shans);
  l.vremyaOzhidaniya = Math.round(vremya * 1000);
  l.vremyaStart = l.vremyaStart || l.vremya;
  l.vremya = l.vremyaStart + l.vremyaOzhidaniya;
}

function kupit(itemId) {
  var item = null;
  for (var i = 0; i < tovari.length; i++) {
    if (tovari[i].id == itemId) item = tovari[i];
  }
  if (!item) return;
  if (item.lvl > lvl) { toast('🔒 Нужен уровень ' + item.lvl, 'err'); return; }
  var cena = randomCena(item.cena);
  if (dengi < cena) { toast('💸 Мало денег', 'err'); return; }
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  dengi = dengi - cena;
  energ = energ - 1;
  inv.push({
    uid: Date.now() + Math.random(),
    itemId: item.id,
    kupCena: cena,
    ap: 0
  });
  toast('✅ Куплено за ' + cena + '₽', 'ok');
  sohranit();
  render();
}

function apnut(uid) {
  var moy = null;
  for (var i = 0; i < inv.length; i++) {
    if (inv[i].uid == uid) moy = inv[i];
  }
  if (!moy) return;
  var item = null;
  for (var j = 0; j < tovari.length; j++) {
    if (tovari[j].id == moy.itemId) item = tovari[j];
  }
  var stoimost = Math.floor(item.ap * (1 + moy.ap * 0.5));
  if (dengi < stoimost) { toast('💸 Мало денег', 'err'); return; }
  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  dengi = dengi - stoimost;
  energ = energ - 1;
  moy.ap = moy.ap + 1;
  toast('🔧 Улучшено до +' + moy.ap, 'ok');
  sohranit();
  render();
}

function vystavitLot(uid) {
  var idx = -1;
  for (var i = 0; i < inv.length; i++) {
    if (inv[i].uid == uid) idx = i;
  }
  if (idx == -1) return;
  var moy = inv[idx];

  var item = null;
  for (var j = 0; j < tovari.length; j++) {
    if (tovari[j].id == moy.itemId) item = tovari[j];
  }

  var minC = minCenaTovara(item);
  var maxC = maxCenaTovara(item);

  var vvod = prompt(
    '💰 Выставь свою цену\n\n' +
    'Можно от ' + minC + ' до ' + maxC + '₽\n\n' +
    '💡 Дешёвая цена — продастся быстро\n' +
    '💡 Дорогая цена — долго ждать',
    minC
  );

  if (vvod === null) return;
  var moyaCena = parseInt(vvod);

  if (isNaN(moyaCena)) { toast('❌ Введи число!', 'err'); return; }
  if (moyaCena < minC) { toast('📉 Слишком дёшево! Мин: ' + minC + '₽', 'err'); return; }
  if (moyaCena > maxC) { toast('📈 Слишком дорого! Макс: ' + maxC + '₽', 'err'); return; }

  inv.splice(idx, 1);

  var lot = {
    uid: Date.now() + Math.random(),
    itemId: moy.itemId,
    kupCena: moy.kupCena,
    ap: moy.ap,
    moyaCena: moyaCena,
    vremyaStart: Date.now()
  };
  rasschitatShansICena(lot, item);

  loty.push(lot);
  toast('🏷️ Лот выставлен за ' + moyaCena + '₽', 'ok');
  sohranit();
  render();
}

function zabratLot(uid) {
  var idx = -1;
  for (var i = 0; i < loty.length; i++) {
    if (loty[i].uid == uid) idx = i;
  }
  if (idx == -1) return;
  var l = loty[idx];
  inv.push({
    uid: Date.now() + Math.random(),
    itemId: l.itemId,
    kupCena: l.kupCena,
    ap: l.ap
  });
  loty.splice(idx, 1);
  toast('↩️ Лот снят', 'ok');
  sohranit();
  render();
}

function prodatLot(uid) {
  var idx = -1;
  for (var i = 0; i < loty.length; i++) {
    if (loty[i].uid == uid) idx = i;
  }
  if (idx == -1) return;
  var l = loty[idx];

  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  var shans = l.shansProdagy || 50;
  var prodano = Math.random() * 100 < shans;

  energ = energ - 1;

  if (prodano) {
    dengi = dengi + l.moyaCena;
    var prof = l.moyaCena - l.kupCena;
    loty.splice(idx, 1);

    if (dengi > lvl * 3000) {
      lvl = lvl + 1;
      maxEnerg = maxEnerg + 2;
      energ = maxEnerg;
      toast('🎉 Уровень ' + lvl + '! +' + prof + '₽', 'ok');
    } else {
      toast('💰 Продано за ' + l.moyaCena + '₽ (' + (prof >= 0 ? '+' : '') + prof + ')', 'ok');
    }
  } else {
    toast('😕 Покупатель не нашёлся... шанс был ' + shans + '%', 'err');
  }
  sohranit();
  render();
}

function prodatMgnovenno(uid) {
  var idx = -1;
  for (var i = 0; i < inv.length; i++) {
    if (inv[i].uid == uid) idx = i;
  }
  if (idx == -1) return;
  var moy = inv[idx];

  if (energ < 1) { toast('⚡ Нет энергии', 'err'); return; }

  var item = null;
  for (var j = 0; j < tovari.length; j++) {
    if (tovari[j].id == moy.itemId) item = tovari[j];
  }

  var bazaProd = moy.kupCena * (1 + moy.ap * 0.4);
  var cenaProd = Math.floor(bazaProd * 0.75);
  var prof = cenaProd - moy.kupCena;

  dengi = dengi + cenaProd;
  energ = energ - 1;
  inv.splice(idx, 1);

  if (dengi > lvl * 3000) {
    lvl = lvl + 1;
    maxEnerg = maxEnerg + 2;
    energ = maxEnerg;
    toast('🎉 Уровень ' + lvl + '! (срочно)', 'ok');
  } else {
    toast('⚡ Срочно: ' + cenaProd + '₽ (' + (prof >= 0 ? '+' : '') + prof + ')', prof >= 0 ? 'ok' : 'err');
  }
  sohranit();
  render();
}

function poluchLeaders() {
  var s = localStorage.getItem('perekup_leaders');
  if (s) {
    try { return JSON.parse(s); } catch(e) { return []; }
  }
  return [];
}

function sohranLeaders(list) {
  localStorage.setItem('perekup_leaders', JSON.stringify(list));
}

function otpravScore() {
  if (!user) return;
  var moyId = user.id || 0;
  var imya = (user.first_name || 'Игрок') + ' ' + (user.last_name || '');
  var list = poluchLeaders();
  var nashel = false;
  for (var i = 0; i < list.length; i++) {
    if (list[i].id == moyId) {
      list[i].name = imya.trim();
      list[i].balance = dengi;
      list[i].level = lvl;
      nashel = true;
    }
  }
  if (!nashel) {
    list.push({
      id: moyId,
      name: imya.trim(),
      balance: dengi,
      level: lvl
    });
  }
  sohranLeaders(list);
  if (vkDostupen() && user.id) {
    vkBridge.send('VKWebAppStorageSet', {
      key: 'leader_' + user.id,
      value: JSON.stringify({ name: imya.trim(), balance: dengi, level: lvl })
    }).catch(function() {});
  }
}

function escapeHtml(s) {
  s = String(s);
  s = s.replace(/&/g, '&amp;');
  s = s.replace(/</g, '&lt;');
  s = s.replace(/>/g, '&gt;');
  s = s.replace(/"/g, '&quot;');
  return s;
}

function sekDoProdazhi(l) {
  var proshlo = Date.now() - l.vremyaStart;
  var ostalos = l.vremyaOzhidaniya - proshlo;
  if (ostalos < 0) ostalos = 0;
  return Math.ceil(ostalos / 1000);
}

function render() {
  document.getElementById('balance').textContent = dengi + ' ₽';
  document.getElementById('level').textContent = lvl;
  document.getElementById('energy').textContent = energ + '/' + maxEnerg;

  var c = document.getElementById('content');

  if (tab == 'market') {
    var html = '';
    for (var i = 0; i < tovari.length; i++) {
      var it = tovari[i];
      var zakr = it.lvl > lvl;
      var cena = randomCena(it.cena);
      var knopka = '';
      if (zakr || dengi < cena) {
        knopka = '<button class="btn" disabled>Купить</button>';
      } else {
        knopka = '<button class="btn" onclick="kupit(\'' + it.id + '\')">Купить</button>';
      }
      html += '<div class="card"><div class="card-row">';
      html += '<div class="card-info">';
      html += '<div class="card-name">' + it.name;
      if (zakr) html += ' 🔒';
      html += '</div>';
      html += '<div class="card-meta">Ур. ' + it.lvl + '</div>';
      html += '</div>';
      html += '<div class="card-price">~' + cena + ' ₽</div>';
      html += knopka;
      html += '</div></div>';
    }
    c.innerHTML = html;
  } else if (tab == 'inventory') {
    if (inv.length == 0) {
      c.innerHTML = '<div class="empty">📦 Пусто. Купи что-нибудь!</div>';
      return;
    }
    var h = '';
    for (var k = 0; k < inv.length; k++) {
      var m = inv[k];
      var tovar = null;
      for (var q = 0; q < tovari.length; q++) {
        if (tovari[q].id == m.itemId) tovar = tovari[q];
      }
      var apCena = Math.floor(tovar.ap * (1 + m.ap * 0.5));
      var minC = minCenaTovara(tovar);
      var maxC = maxCenaTovara(tovar);

      h += '<div class="card">';
      h += '<div class="card-row">';
      h += '<div class="card-info">';
      h += '<div class="card-name">' + tovar.name;
      if (m.ap > 0) h += ' +' + m.ap;
      h += '</div>';
      h += '<div class="card-meta">Куплено: ' + m.kupCena + '₽</div>';
      h += '<div class="card-meta">Диапазон цен: ' + minC + '–' + maxC + '₽</div>';
      h += '</div>';
      h += '</div>';
      h += '<div class="card-row" style="margin-top:8px">';
      h += '<button class="btn small" onclick="apnut(' + m.uid + ')">🔧 ' + apCena + '₽</button>';
      h += '<button class="btn small green" onclick="vystavitLot(' + m.uid + ')">🏷️ Выставить</button>';
      h += '<button class="btn small" onclick="prodatMgnovenno(' + m.uid + ')">⚡ Срочно</button>';
      h += '</div>';
      h += '</div>';
    }
    c.innerHTML = h;
  } else if (tab == 'lots') {
    if (loty.length == 0) {
      c.innerHTML = '<div class="empty">🏷️ Нет активных лотов<br><br>Выстави товар из сумки</div>';
      return;
    }
    var hl = '';
    hl += '<div class="lot-hint">💡 Дешевле цена → быстрее продажа и выше шанс. Дорого → долго ждать и риск провала.</div>';
    for (var w = 0; w < loty.length; w++) {
      var l = loty[w];
      var t2 = null;
      for (var e = 0; e < tovari.length; e++) {
        if (tovari[e].id == l.itemId) t2 = tovari[e];
      }
      var sek = sekDoProdazhi(l);
      var gotov = sek <= 0;
      var shans = l.shansProdagy || 50;

      var progress = 0;
      if (l.vremyaOzhidaniya > 0) {
        progress = 100 - (sek * 1000 / l.vremyaOzhidaniya) * 100;
        if (progress < 0) progress = 0;
        if (progress > 100) progress = 100;
      }

      hl += '<div class="card">';
      hl += '<div class="card-row">';
      hl += '<div class="card-info">';
      hl += '<div class="card-name">' + t2.name;
      if (l.ap > 0) hl += ' +' + l.ap;
      hl += '</div>';
      hl += '<div class="card-meta">Куплено за ' + l.kupCena + '₽</div>';
      if (gotov) {
        hl += '<div class="lot-chance">✅ Готов к продаже · шанс ' + shans + '%</div>';
      } else {
        hl += '<div class="lot-timer">⏳ Осталось: ' + sek + ' сек · шанс ' + shans + '%</div>';
      }
      hl += '</div>';
      hl += '<div class="card-price">' + l.moyaCena + ' ₽</div>';
      hl += '</div>';
      hl += '<div class="lot-bar"><div class="lot-bar-in" style="width:' + progress + '%"></div></div>';
      hl += '<div class="card-row" style="margin-top:8px">';
      if (gotov) {
        hl += '<button class="btn small green" onclick="prodatLot(' + l.uid + ')">💰 Продать (' + shans + '%)</button>';
      } else {
        hl += '<button class="btn small" disabled>⏳ Жди ' + sek + ' сек</button>';
      }
      hl += '<button class="btn small red" onclick="zabratLot(' + l.uid + ')">↩️ Снять</button>';
      hl += '</div>';
      hl += '</div>';
    }
    c.innerHTML = hl;
  } else if (tab == 'leaders') {
    var list = poluchLeaders();
    if (list.length == 0) {
      c.innerHTML = '<div class="empty">🏆 Пока никого нет</div>';
      return;
    }
    list.sort(function(a, b) { return b.balance - a.balance; });
    var moyId = user ? user.id : 0;
    var top10 = list.slice(0, 10);
    var moyIndex = -1;
    for (var z = 0; z < list.length; z++) {
      if (list[z].id == moyId) moyIndex = z;
    }
    var out = '<div class="lb-refresh">🔄 Топ-10 игроков</div>';
    for (var v = 0; v < top10.length; v++) {
      var u = top10[v];
      var klass = '';
      var medal = '';
      if (v == 0) { klass = 'gold'; medal = '🥇'; }
      else if (v == 1) { klass = 'silver'; medal = '🥈'; }
      else if (v == 2) { klass = 'bronze'; medal = '🥉'; }
      else { medal = v + 1; }
      var etoYa = (u.id == moyId);
      out += '<div class="lb-row';
      if (etoYa) out += ' me';
      out += '">';
      out += '<div class="lb-rank ' + klass + '">' + medal + '</div>';
      out += '<div class="lb-info">';
      out += '<div class="lb-name">' + escapeHtml(u.name);
      if (etoYa) out += ' (ты)';
      out += '</div>';
      out += '<div class="lb-sub">Уровень ' + u.level + '</div>';
      out += '</div>';
      out += '<div class="lb-balance">' + u.balance + ' ₽</div>';
      out += '</div>';
    }
    if (moyIndex >= 10) {
      out += '<div class="lb-refresh" style="margin-top:16px">📍 Твоё место</div>';
      var ya = list[moyIndex];
      out += '<div class="lb-row me">';
      out += '<div class="lb-rank">' + (moyIndex + 1) + '</div>';
      out += '<div class="lb-info">';
      out += '<div class="lb-name">' + escapeHtml(ya.name) + ' (ты)</div>';
      out += '<div class="lb-sub">Уровень ' + ya.level + '</div>';
      out += '</div>';
      out += '<div class="lb-balance">' + ya.balance + ' ₽</div>';
      out += '</div>';
    }
    c.innerHTML = out;
  }
}

var vseTaby = document.querySelectorAll('.tab');
for (var i = 0; i < vseTaby.length; i++) {
  vseTaby[i].onclick = function() {
    for (var j = 0; j < vseTaby.length; j++) {
      vseTaby[j].classList.remove('active');
    }
    this.classList.add('active');
    tab = this.getAttribute('data-tab');
    render();
  };
}

zagruzit();
render();

setInterval(function() {
  if (energ < maxEnerg) {
    energ = energ + 1;
    sohranit();
    render();
  }
}, 60000);

setInterval(function() {
  if (tab == 'lots' || tab == 'leaders') render();
}, 1000);
</script>
